    <!-- Geschichte sozialer Netzwerke 
    <div class="column" id="col3">
      <div class="column-header" id="header3">
        <h2>soziale Netzwerke</h2>
      </div>
      <div class="column-content">
        <div class="index-detail">

        <p class="top">Plattformen wie TikTok, Instagram oder Facebook bezeichnen wir als „soziale" Medien, doch fördern
            sie wirklich menschliche Verbindung? Im Zuge meiner Bachelorarbeit („Wie überlebe ich mit
            Smartphone? Ein postdigitaler Survival-Guide") stellte ich fest, dass dies oft nicht der Fall ist:
            Durch Filterblasen, Endlosschleifen und polarisierende Algorithmen isolieren soziale Medien uns
            häufig. In meinem Masterprojekt möchte ich mich nun dieser Frage widmen: Was passiert, wenn wir das
            Soziale in diesen Medien radikal neu denken? Das angestrebte Projekt soll eine spekulative
            Auseinandersetzung mit der Idee eines neuartigen sozialen Mediums sein, einer Plattform, die
            sich nicht dem Prinzip der Aufmerksamkeit unterwirft, sondern einem digitalen Perspektivwechsel
            verpflichtet ist. Sie soll Empathie fördern, Brücken schlagen und reale emotionale Begegnungen zwischen
            Menschen
            ermöglichen, statt sie zu simulieren. Im Rahmen des Projekts möchte ich eine digitale Publikation
            gestalten, die diese Utopie skizziert und greifbar macht. Inspiriert von analogen Praktiken wie
            Brieffreundschaften und dem Prinzip des Zuhörens ohne Vorurteil soll ein Produkt entstehen, das
            sich zwischen Konzeptbuch, interaktiver Website, Forum und vielleicht auch analoger Intervention
            bewegt.</p>


        <p class="underlined">Ursprung</p><p>Die Wurzeln sozialer Medien liegen im Analogen: in Höhlenmalereien, im Stein von Rosette, in der Lutherbibel, 
            in der ersten Zeitung und im Telegraphen. Sie liegen im menschlichen Bedürfnis nach Kommunikation und Gemeinschaft.
            Doch über die Jahrtausende haben sich nicht nur die Medien, die Menschen zur Verfügung stehen verändert, sondern auch sie selbst.</p><p>1978 entstand mit dem Bulletin Board System (BBS) die erste Form
            digitaler Öffentlichkeit. Texte wurden über Telefonleitungen geteilt und waren sichtbar für alle, die sich
            einwählten. Diese frühen Netze funktionierten wie lokale Gemeinschaften und basierten ausschließlich auf Text.
            In den 1980er-Jahren folgten Projekte wie The WELL, die den Gedanken vertieften, dass Netzwerke Orte des
            Austauschs und kollektiver Intelligenz sein könnten. 
            Mit der Einführung des World Wide Web in den 1990er-Jahren verschob sich der Fokus. GeoCities (1994) und ähnliche
            Plattformen ermöglichten es, individuelle Räume zu schaffen – digitale Häuser mit eigenen Inhalten. Die Idee
            persönlicher Präsenz im Netz war geboren. Classmates.com (1995) digitalisierte soziale Erinnerungen,
            SixDegrees.com (1997) formulierte das Prinzip der „vernetzten Identität“: Profile, Beziehungen, geteilte
            Inhalte. Dieses Konzept wurde zur Grundlage aller späteren Plattformen.</p>

            <p class="indent"> Aus diesen frühen Formen entstanden
            in den 2000er-Jahren neue Verzweigungen. Friendster (2001) legte den Fokus auf soziale Bindungen, MySpace
            (2003) auf Selbstdarstellung und Musik, LinkedIn auf berufliche Beziehungen. Facebook (2004) vereinte all
            diese Prinzipien und schuf ein modulares System sozialer Interaktion: Freundschaft, Status, Bild,
            Zustimmung. Die Plattform wurde zum zentralen Knotenpunkt des digitalen Lebens und prägte für ein Jahrzehnt
            die Vorstellung davon, was „soziale Medien“ sind. Parallel dazu entstanden spezialisierte Seiten. YouTube
            (2005) verlagerte Kommunikation in den audiovisuellen Raum, Reddit strukturierte Gemeinschaften thematisch,
            Twitter kondensierte sie auf kurze Nachrichten. Diese Plattformen trieben eine Entwicklung voran, die bis
            heute zentral ist: Der Übergang von linearem Austausch zu algorithmischer Verteilung. Inhalte wurden nicht
            mehr primär chronologisch, sondern nach Relevanz angezeigt – eine unsichtbare Ordnung, gesteuert durch
            Berechnung. Mit dem Smartphone begann eine neue Phase. Instagram (2010), Snapchat (2011) und TikTok (2016)
            verschmolzen Medienproduktion, Konsum und soziale Interaktion. Der Alltag selbst wurde zum Inhalt. Bilder
            und Videos ersetzten Texte als bevorzugte Kommunikationsform.</p>

            <p class="indent">Gleichzeitig verlagerte sich soziale
            Wahrnehmung ins Visuelle: Identität wurde zu Oberfläche, Anerkennung zu Metrik. Gesellschaftlich fiel diese
            Entwicklung in eine Zeit wachsender Mobilität und Individualisierung. Plattformen dienten zunehmend nicht
            nur der Kommunikation, sondern der Selbstverortung. Tinder (2012) übertrug soziale Mechanismen auf Intimität
            und Auswahl, LinkedIn auf Arbeit, BeReal (2020) auf Authentizität. Jede neue Anwendung reagierte auf eine
            Lücke oder Überforderung der vorherigen. Der Stammbaum der sozialen Medien lässt sich daher nicht nur
            technisch, sondern auch kulturell lesen. Aus den textbasierten Foren entstanden Räume der Selbstdarstellung,
            aus diesen wiederum Märkte der Aufmerksamkeit. Der Algorithmus übernahm die Rolle eines unsichtbarenVermittlers, der Beziehungen, Interessen und Emotionen sortiert.</p>

            <p class="indent"> Die Struktur des Sozialen wandelte sich von
            wechselseitigem Austausch zu datengetriebener Selektion. Heute ist das Netzwerk kein Werkzeug mehr, sondern
            Umwelt. Jede Plattform trägt die DNA ihrer Vorgänger in sich: das Gemeinschaftsprinzip von BBS, die
            Diskussionskultur von The WELL, die Profilstruktur von SixDegrees, die Oberflächenlogik von Facebook, die
            Beschleunigung von Twitter und die Performativität von TikTok. Die Evolution sozialer Medien ist damit nicht
            abgeschlossen, sondern fortlaufend – ein System, das sich selbst beobachtet, imitiert und neu erfindet,
            während es die Kommunikationsformen seiner Nutzer in Echtzeit reproduziert.</p><p class="underlined">Zukunft</p>Die Entwicklung sozialer Medien steht nicht still. Während die erste Generation den digitalen Raum erschloss und
            die zweite ihn strukturierte, beginnt nun eine dritte Phase: die Integration sozialer Systeme in technische
            Infrastrukturen, die sich selbst anpassen, beobachten und handeln können. Die Plattformen der Gegenwart – TikTok,
            Instagram, X, Reddit, Threads – sind nicht länger bloße Werkzeuge, sondern Teil eines vernetzten Ökosystems, das
            Verhalten in Daten übersetzt und daraus neue Formen sozialer Interaktion erzeugt. Künstliche Intelligenz wird dabei
            zum zentralen Vermittler: Sie filtert, kuratiert, generiert und personalisiert Inhalte in Echtzeit.
            <a href="https://www.britannica.com/topic/social-network" target="_blank" rel="noopener noreferrer">🡒Britannica</a>
            </p>

            <p class="indent">
            Diese neue Stufe sozialer Medien zeichnet sich durch Automatisierung, Simulation und Verschmelzung aus. Virtuelle
            Avatare übernehmen Kommunikation, algorithmische Systeme erzeugen Emotionen, und maschinelles Lernen schreibt die
            soziale Grammatik fort. Plattformen wie TikTok oder Instagram Reels zeigen, wie KI-gesteuerte Empfehlungssysteme
            nicht nur Interessen abbilden, sondern sie erzeugen. Der Strom der Inhalte wird dadurch weniger Ausdruck menschlicher
            Kreativität als Spiegel kollektiver Datenmuster. Soziale Medien beginnen, die Aufmerksamkeit zu gestalten, bevor sie
            überhaupt entsteht.

            <a href="https://www.pewresearch.org/internet/2023/05/18/how-ai-is-reshaping-online-experiences/" target="_blank" rel="noopener noreferrer">🡒Pew Research</a>
            </p>Parallel dazu verschieben sich Grenzen zwischen Plattform, Medium und Realität. Das „Social Web“ wird zum
            „Ambient Web“ – ein allgegenwärtiges Netzwerk, das über Spracheingabe, Wearables und virtuelle Räume in den
            Alltag eingebettet ist. Das Metaverse, als Vision einer persistenten, dreidimensionalen Online-Umgebung,
            verdeutlicht diesen Trend: soziale Präsenz ohne physischen Raum, Identität ohne Körper, Interaktion ohne Grenze.
            Ob sich diese Vorstellung durchsetzt, hängt weniger von Technologie als von Akzeptanz ab. Schon heute experimentieren
            Plattformen wie Horizon Worlds oder Roblox mit hybriden Räumen, in denen Konsum, Spiel und soziale Erfahrung
            ununterscheidbar werden.
            <a href="https://www.wired.com/story/the-metaverse-is-just-getting-started/" target="_blank" rel="noopener noreferrer">🡒Wired</a>

            Gleichzeitig wächst das Bewusstsein für die Schattenseiten dieser Entwicklung.           
            </p>

            <p class="indent">
            Themen wie Datenschutz,
            algorithmische Diskriminierung, psychische Gesundheit und Desinformation prägen die Diskussion über die

            Neue Netzwerke wie Mastodon oder Bluesky versuchen, soziale Kommunikation von zentralen Servern zu lösen und

            <p class="indent">

  <script>
    // Theme-Button Text je nach Theme aktualisieren
    function updateThemeButtonText() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const themeText = document.getElementById('theme-text');
      const themeTextCol1 = document.getElementById('theme-text-col1');
      const newText = currentTheme === 'dark' ? 'light' : 'dark';
      
      if (themeText) {
        themeText.textContent = newText;
      }
      if (themeTextCol1) {
        themeTextCol1.textContent = newText;
      }
    }
    
    // Theme wechseln Funktion
    function toggleTheme() {
      const root = document.documentElement;
      const currentTheme = root.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      root.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeButtonText();
    }
    
    // Theme wechseln beim Klick auf theme-button (beide Buttons)
    document.getElementById('theme-button').addEventListener('click', toggleTheme);
    document.getElementById('theme-button-col1').addEventListener('click', toggleTheme);
    
    // Initial setzen
    updateThemeButtonText();
