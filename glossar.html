  <div class="glossar-content">
    <div class="glossar-items" id="glossar-items">
      <button class="glossar-term" data-id="achtsamkeit" data-desc="Bewusste Wahrnehmung des gegenwärtigen Moments ohne Bewertung. Wird als Gegenmittel zur digitalen Ablenkung empfohlen.">Achtsamkeit</button>
      <button class="glossar-term" data-id="algorithmus" data-desc="Rechenvorschrift, die bestimmt, welche Inhalte Nutzer:innen in sozialen Medien angezeigt bekommen.">Algorithmus</button>
      <button class="glossar-term" data-id="arbeitsgedaechtnis" data-desc="Kurzzeitspeicher des Gehirns für aktuelle Informationen. Wird durch ständige Benachrichtigungen überlastet.">Arbeitsgedächtnis</button>
      <button class="glossar-term" data-id="arfilter" data-desc="Augmented-Reality-Effekte, die das Gesicht oder die Umgebung in Echtzeit verändern – z.B. auf Instagram oder Snapchat.">AR-Filter</button>
      <button class="glossar-term" data-id="audience" data-desc="Die Zielgruppe oder Followerschaft eines Social-Media-Accounts.">Audience</button>
      <button class="glossar-term" data-id="aufmerksamkeitsoekonomie" data-desc="Wirtschaftsmodell, in dem menschliche Aufmerksamkeit zur handelbaren Ressource wird.">Aufmerksamkeitsökonomie</button>
      <button class="glossar-term" data-id="aufmerksamkeitsspanne" data-desc="Zeitraum, in dem sich eine Person auf eine Aufgabe konzentrieren kann. Durch Social Media nachweislich verkürzt.">Aufmerksamkeitsspanne</button>
      <button class="glossar-term" data-id="backfireeffekt" data-desc="Phänomen, bei dem Gegenargumente die ursprüngliche Überzeugung verstärken statt sie zu schwächen.">Backfire-Effekt</button>
      <button class="glossar-term" data-id="benchmark" data-desc="Vergleichswert zur Messung von Leistung oder Erfolg im Social-Media-Marketing.">Benchmark</button>
      <button class="glossar-term" data-id="bestaetigungsfehler" data-desc="Tendenz, Informationen so auszuwählen, dass sie bestehende Überzeugungen bestätigen.">Bestätigungsfehler</button>
      <button class="glossar-term" data-id="bildschirmzeit" data-desc="Gesamtdauer der täglichen Nutzung digitaler Geräte. Wird zunehmend als Gesundheitsindikator betrachtet.">Bildschirmzeit</button>
      <button class="glossar-term" data-id="blockchain" data-desc="Dezentrale Datenbanktechnologie, die Grundlage für Kryptowährungen und NFTs bildet.">Blockchain</button>
      <button class="glossar-term" data-id="bodyscan" data-desc="Achtsamkeitsübung zur bewussten Wahrnehmung körperlicher Empfindungen.">Bodyscan</button>
      <button class="glossar-term" data-id="boomer" data-desc="Angehörige der Babyboomer-Generation (1946–1964). Im Netzjargon oft abwertend für technisch weniger versierte ältere Menschen.">Boomer</button>
      <button class="glossar-term" data-id="brainrot" data-desc="Umgangssprachlich für geistige Abstumpfung durch übermäßigen Konsum seichter Online-Inhalte.">Brain Rot</button>
      <button class="glossar-term" data-id="breadcrumbing" data-desc="Hinhaltetaktik in Online-Beziehungen durch sporadische, unverbindliche Nachrichten.">Breadcrumbing</button>
      <button class="glossar-term" data-id="bubble" data-desc="Siehe Filterblase. Informationsraum, in dem nur gleichgesinnte Meinungen zirkulieren.">Bubble</button>
      <button class="glossar-term" data-id="cancelung" data-desc="Öffentlicher Boykott einer Person wegen moralisch fragwürdiger Aussagen oder Handlungen.">Cancelung</button>
      <button class="glossar-term" data-id="chatbot" data-desc="Software, die automatisiert Konversationen führt, oft auf Basis von KI.">Chatbot</button>
      <button class="glossar-term" data-id="clicktivism" data-desc="Oberflächlicher Online-Aktivismus, der sich auf Likes und Shares beschränkt.">Clicktivism</button>
      <button class="glossar-term" data-id="cocreator" data-desc="Nutzer:in, die aktiv an der Erstellung von Inhalten mitwirkt.">Co-Creator</button>
      <button class="glossar-term" data-id="contentcreator" data-desc="Person, die regelmäßig Inhalte für soziale Medien produziert.">Content Creator</button>
      <button class="glossar-term" data-id="copingstrategie" data-desc="Methode zur Bewältigung von Stress oder negativen Emotionen.">Coping-Strategie</button>
      <button class="glossar-term" data-id="copium" data-desc="Internet-Slang für Selbstberuhigung nach Enttäuschungen oder Misserfolgen.">Copium</button>
      <button class="glossar-term" data-id="cringe" data-desc="Gefühl der Fremdscham bei peinlichen Inhalten oder Verhalten.">Cringe</button>
      <button class="glossar-term" data-id="crowdsourcing" data-desc="Auslagerung von Aufgaben an eine große Gruppe von Menschen über das Internet.">Crowdsourcing</button>
      <button class="glossar-term" data-id="cue" data-desc="Auslösereiz, der ein bestimmtes Verhalten oder eine Gewohnheit triggert.">Cue</button>
      <button class="glossar-term" data-id="cybergrooming" data-desc="Anbahnung sexueller Kontakte mit Minderjährigen über das Internet.">Cybergrooming</button>
      <button class="glossar-term" data-id="cybermobbing" data-desc="Systematische Belästigung oder Diffamierung einer Person über digitale Kanäle.">Cybermobbing</button>
      <button class="glossar-term" data-id="cyberspace" data-desc="Virtueller Raum der vernetzten Computer und digitalen Kommunikation.">Cyberspace</button>
      <button class="glossar-term" data-id="cyberstalking" data-desc="Wiederholte Belästigung oder Verfolgung einer Person über digitale Medien.">Cyberstalking</button>
      <button class="glossar-term" data-id="darkpattern" data-desc="Manipulative Designelemente, die Nutzer:innen zu ungewollten Handlungen verleiten.">Dark Pattern</button>
      <button class="glossar-term" data-id="datamining" data-desc="Automatisierte Analyse großer Datenmengen zur Erkennung von Mustern.">Data Mining</button>
      <button class="glossar-term" data-id="debunking" data-desc="Widerlegung von Falschinformationen durch Faktenprüfung.">Debunking</button>
      <button class="glossar-term" data-id="deepfake" data-desc="KI-generiertes Video oder Bild, das Personen täuschend echt darstellt.">Deepfake</button>
      <button class="glossar-term" data-id="deepnude" data-desc="KI-Software, die Nacktbilder aus bekleideten Fotos generiert – ohne Einwilligung.">Deepnude</button>
      <button class="glossar-term" data-id="digitaleamnesie" data-desc="Vergessen von Informationen, die digital gespeichert sind – weil das Gehirn sie nicht mehr behält.">Digitale Amnesie</button>
      <button class="glossar-term" data-id="digitalerdetox" data-desc="Bewusster Verzicht auf digitale Geräte für einen bestimmten Zeitraum.">Digitaler Detox</button>
      <button class="glossar-term" data-id="digitalerfussabdruck" data-desc="Gesamtheit aller online hinterlassenen Datenspuren einer Person.">Digitaler Fußabdruck</button>
      <button class="glossar-term" data-id="digitallabour" data-desc="Unbezahlte Arbeit, die Nutzer:innen durch ihre Aktivitäten für Plattformen leisten.">Digital Labour</button>
      <button class="glossar-term" data-id="digitalnatives" data-desc="Generation, die mit digitalen Technologien aufgewachsen ist.">Digital Natives</button>
      <button class="glossar-term" data-id="digitalerschnuller" data-desc="Einsatz von Smartphones zur Beruhigung von Kindern – mit fraglichen Langzeitfolgen.">Digitaler Schnuller</button>
      <button class="glossar-term" data-id="dm" data-desc="Direct Message – private Nachricht auf Social-Media-Plattformen.">DM</button>
      <button class="glossar-term" data-id="doomscrolling" data-desc="Zwanghaftes Scrollen durch negative Nachrichten, obwohl es dem Wohlbefinden schadet.">Doomscrolling</button>
      <button class="glossar-term" data-id="dopaminausschuettung" data-desc="Freisetzung des Neurotransmitters Dopamin bei Belohnungsreizen – z.B. bei Likes.">Dopaminausschüttung</button>
      <button class="glossar-term" data-id="dopaminfasten" data-desc="Bewusster Verzicht auf stimulierende Aktivitäten zur Wiederherstellung der Reizempfindlichkeit.">Dopaminfasten</button>
      <button class="glossar-term" data-id="echokammer" data-desc="Geschlossener Kommunikationsraum, in dem nur übereinstimmende Meinungen verstärkt werden.">Echokammer</button>
      <button class="glossar-term" data-id="empathie" data-desc="Fähigkeit, sich in die Gefühle anderer hineinzuversetzen – online oft eingeschränkt.">Empathie</button>
      <button class="glossar-term" data-id="facebook" data-desc="2004 gegründetes soziales Netzwerk, heute Teil des Meta-Konzerns. Über 3 Milliarden Nutzer:innen.">Facebook</button>
      <button class="glossar-term" data-id="fakenews" data-desc="Absichtlich verbreitete Falschinformationen, oft mit manipulativer Absicht.">Fake News</button>
      <button class="glossar-term" data-id="femmefatale" data-desc="Archetyp der verführerischen, gefährlichen Frau – im Netz oft ästhetisiert.">Femme Fatale</button>
      <button class="glossar-term" data-id="flow" data-desc="Zustand völliger Vertiefung in eine Tätigkeit. Wird durch ständige Unterbrechungen gestört.">Flow</button>
      <button class="glossar-term" data-id="fomo" data-desc="Fear Of Missing Out – Angst, etwas zu verpassen. Verstärkt durch soziale Medien.">FOMO</button>
      <button class="glossar-term" data-id="foryoupage" data-desc="Personalisierter Feed auf TikTok, der algorithmisch kuratierte Inhalte zeigt.">For You Page</button>
      <button class="glossar-term" data-id="gamification" data-desc="Einsatz spielerischer Elemente in nicht-spielerischen Kontexten zur Motivationssteigerung.">Gamification</button>
      <button class="glossar-term" data-id="genz" data-desc="Generation der zwischen 1997 und 2012 Geborenen – erste vollständig digital sozialisierte Generation.">Gen Z</button>
      <button class="glossar-term" data-id="geotargeting" data-desc="Standortbasierte Auslieferung von Werbung oder Inhalten.">Geotargeting</button>
      <button class="glossar-term" data-id="gewohnheit" data-desc="Automatisiertes Verhaltensmuster, das durch Wiederholung entsteht.">Gewohnheit</button>
      <button class="glossar-term" data-id="ghostwriter" data-desc="Person, die Texte im Namen anderer verfasst – auch für Influencer:innen.">Ghostwriter</button>
      <button class="glossar-term" data-id="granfluencer" data-desc="Ältere Influencer:innen (meist 60+), die in sozialen Medien aktiv sind.">Granfluencer</button>
      <button class="glossar-term" data-id="growthhacking" data-desc="Experimentelle Marketingstrategien für schnelles Nutzerwachstum.">Growth Hacking</button>
      <button class="glossar-term" data-id="hatespeech" data-desc="Hassrede – Äußerungen, die Gruppen oder Einzelpersonen herabsetzen oder bedrohen.">Hate Speech</button>
      <button class="glossar-term" data-id="hedonist" data-desc="Person, die Lustmaximierung als Lebensprinzip verfolgt.">Hedonist</button>
      <button class="glossar-term" data-id="hookupculture" data-desc="Kultur unverbindlicher sexueller Begegnungen, oft durch Dating-Apps begünstigt.">Hookup Culture</button>
      <button class="glossar-term" data-id="ikigai" data-desc="Japanisches Konzept für den persönlichen Lebenssinn – Schnittmenge aus Leidenschaft, Berufung, Mission und Beruf.">Ikigai</button>
      <button class="glossar-term" data-id="impulsivitaet" data-desc="Neigung zu schnellen, unüberlegten Handlungen – wird durch Social Media gefördert.">Impulsivität</button>
      <button class="glossar-term" data-id="individualmedien" data-desc="Medien für die Kommunikation zwischen Einzelpersonen, z.B. Messenger.">Individualmedien</button>
      <button class="glossar-term" data-id="infinitescroll" data-desc="Designprinzip, bei dem Inhalte endlos nachladen – hält Nutzer:innen länger auf der Plattform.">Infinite Scroll</button>
      <button class="glossar-term" data-id="influencer" data-desc="Person mit großer Reichweite, die Meinungen und Kaufentscheidungen beeinflusst.">Influencer</button>
      <button class="glossar-term" data-id="instagram" data-desc="2010 gegründete Foto- und Video-Plattform, seit 2012 Teil von Meta.">Instagram</button>
      <button class="glossar-term" data-id="instagrammable" data-desc="Bezeichnung für Orte oder Momente, die sich besonders gut für Instagram-Fotos eignen.">Instagrammable</button>
      <button class="glossar-term" data-id="interaktionsstoerung" data-desc="Beeinträchtigung zwischenmenschlicher Kommunikation durch Smartphone-Nutzung.">Interaktionsstörung</button>
      <button class="glossar-term" data-id="intimitaetsmotiv" data-desc="Grundbedürfnis nach Nähe und vertrauensvollen Beziehungen.">Intimitätsmotiv</button>
      <button class="glossar-term" data-id="kognitivedissonanz" data-desc="Unangenehmes Gefühl bei widersprüchlichen Überzeugungen oder Handlungen.">Kognitive Dissonanz</button>
      <button class="glossar-term" data-id="konditionierung" data-desc="Lernprozess, bei dem Verhaltensweisen durch Belohnung oder Bestrafung verstärkt werden.">Konditionierung</button>
      <button class="glossar-term" data-id="lifelogging" data-desc="Kontinuierliche Dokumentation des eigenen Lebens durch digitale Aufzeichnungen.">Lifelogging</button>
      <button class="glossar-term" data-id="lurker" data-desc="Passive Nutzer:in, die Inhalte konsumiert, aber nicht selbst beiträgt.">Lurker</button>
      <button class="glossar-term" data-id="machinelearning" data-desc="Teilbereich der KI, bei dem Systeme aus Daten lernen und sich verbessern.">Machine Learning</button>
      <button class="glossar-term" data-id="massenmedien" data-desc="Medien, die Inhalte an ein großes, disperses Publikum verbreiten.">Massenmedien</button>
      <button class="glossar-term" data-id="massenkonsum" data-desc="Standardisierter Konsum von Gütern und Inhalten durch große Bevölkerungsgruppen.">Massenkonsum</button>
      <button class="glossar-term" data-id="medienkompetenz" data-desc="Fähigkeit, Medien kritisch zu analysieren, zu verstehen und sinnvoll zu nutzen.">Medienkompetenz</button>
      <button class="glossar-term" data-id="medienpsychologie" data-desc="Wissenschaft von den psychologischen Wirkungen von Medien auf Menschen.">Medienpsychologie</button>
      <button class="glossar-term" data-id="memekultur" data-desc="Kulturelle Praxis des Erstellens und Teilens von Memes als Kommunikationsform.">Meme-Kultur</button>
      <button class="glossar-term" data-id="messenger" data-desc="Anwendung für Echtzeitkommunikation, z.B. WhatsApp, Telegram, Signal.">Messenger</button>
      <button class="glossar-term" data-id="meta" data-desc="Mutterkonzern von Facebook, Instagram und WhatsApp. Seit 2021 unter diesem Namen.">Meta</button>
      <button class="glossar-term" data-id="metadaten" data-desc="Daten über Daten – z.B. Zeitstempel, Standort, Geräteinformationen.">Metadaten</button>
      <button class="glossar-term" data-id="metrik" data-desc="Messbare Kennzahl zur Bewertung von Erfolg, z.B. Likes, Reichweite, Engagement.">Metrik</button>
      <button class="glossar-term" data-id="millennial" data-desc="Generation der zwischen 1981 und 1996 Geborenen.">Millennial</button>
      <button class="glossar-term" data-id="mit" data-desc="Massachusetts Institute of Technology – führende Forschungsuniversität für Technologie.">MIT</button>
      <button class="glossar-term" data-id="mobilehealth" data-desc="Gesundheitsbezogene Anwendungen und Dienste auf mobilen Geräten.">Mobile Health</button>
      <button class="glossar-term" data-id="moodmanagementtheorie" data-desc="Theorie, dass Menschen Medien nutzen, um ihre Stimmung zu regulieren.">Mood-Management-Theorie</button>
      <button class="glossar-term" data-id="negativitybias" data-desc="Psychologische Tendenz, negativen Informationen mehr Gewicht zu geben als positiven.">Negativity Bias</button>
      <button class="glossar-term" data-id="newsfeed" data-desc="Zentrale Übersicht aktueller Inhalte auf einer Social-Media-Plattform.">Newsfeed</button>
      <button class="glossar-term" data-id="nomophobia" data-desc="Angst, ohne Mobiltelefon zu sein – Kunstwort aus „No Mobile Phone Phobia&quot;.">Nomophobia</button>
      <button class="glossar-term" data-id="nudging" data-desc="Sanfte Beeinflussung von Entscheidungen durch Gestaltung der Wahlarchitektur.">Nudging</button>
      <button class="glossar-term" data-id="onlinedating" data-desc="Partnersuche über digitale Plattformen und Apps.">Onlinedating</button>
      <button class="glossar-term" data-id="polarisierung" data-desc="Verstärkung extremer Positionen in der Gesellschaft – oft durch Algorithmen begünstigt.">Polarisierung</button>
      <button class="glossar-term" data-id="popup" data-desc="Fenster, das sich automatisch öffnet – oft für Werbung oder Benachrichtigungen.">Pop-Up</button>
      <button class="glossar-term" data-id="populismus" data-desc="Politische Strategie, die „das Volk&quot; gegen „die Elite&quot; inszeniert – oft in sozialen Medien verbreitet.">Populismus</button>
      <button class="glossar-term" data-id="postdigitalitaet" data-desc="Zustand, in dem das Digitale so alltäglich ist, dass es nicht mehr als besonders wahrgenommen wird.">Postdigitalität</button>
      <button class="glossar-term" data-id="praefrontalerkortex" data-desc="Hirnregion für Impulskontrolle, Planung und rationales Denken – reift erst mit ca. 25 Jahren aus.">Präfrontaler Kortex</button>
      <button class="glossar-term" data-id="prebunking" data-desc="Präventive Aufklärung über Manipulationstechniken, bevor Falschinformationen auftreten.">Prebunking</button>
      <button class="glossar-term" data-id="produktplatzierung" data-desc="Integration von Markenprodukten in Inhalte – oft als Werbung gekennzeichnet.">Produktplatzierung</button>
      <button class="glossar-term" data-id="profitmaximierung" data-desc="Wirtschaftliches Ziel, den Gewinn zu maximieren – Antrieb vieler Plattformdesigns.">Profitmaximierung</button>
      <button class="glossar-term" data-id="prokrastination" data-desc="Aufschieben wichtiger Aufgaben zugunsten kurzfristiger Belohnungen – z.B. Social Media.">Prokrastination</button>
      <button class="glossar-term" data-id="prosument" data-desc="Person, die gleichzeitig Produzent:in und Konsument:in von Inhalten ist.">Prosument</button>
      <button class="glossar-term" data-id="pushbenachrichtigung" data-desc="Automatische Nachricht, die auf dem Bildschirm erscheint – oft als Aufmerksamkeitsfalle.">Push-Benachrichtigung</button>
      <button class="glossar-term" data-id="rabbithole" data-desc="Metapher für das tiefe Eintauchen in zusammenhängende Inhalte – oft algorithmisch gesteuert.">Rabbithole</button>
      <button class="glossar-term" data-id="reddit" data-desc="2005 gegründete Plattform für themenbasierte Diskussionsforen (Subreddits).">Reddit</button>
      <button class="glossar-term" data-id="reel" data-desc="Kurzvideoformat auf Instagram, inspiriert von TikTok.">Reel</button>
      <button class="glossar-term" data-id="reichweite" data-desc="Anzahl der Personen, die einen Inhalt potenziell sehen können.">Reichweite</button>
      <button class="glossar-term" data-id="reizueberflutung" data-desc="Überforderung durch zu viele gleichzeitige Sinneseindrücke.">Reizüberflutung</button>
      <button class="glossar-term" data-id="relativismus" data-desc="Ansicht, dass Wahrheit und Werte kontextabhängig sind – kann Faktenleugnung begünstigen.">Relativismus</button>
      <button class="glossar-term" data-id="routine" data-desc="Regelmäßig wiederholte Verhaltensabfolge – kann bewusst für Digital Wellbeing gestaltet werden.">Routine</button>
      <button class="glossar-term" data-id="salienterreiz" data-desc="Auffälliger Stimulus, der automatisch Aufmerksamkeit anzieht.">Salienter Reiz</button>
      <button class="glossar-term" data-id="secondscreen" data-desc="Nutzung eines zweiten Bildschirms (meist Smartphone) parallel zum Fernsehen.">Second Screen</button>
      <button class="glossar-term" data-id="selbstdisziplin" data-desc="Fähigkeit, kurzfristige Impulse zugunsten langfristiger Ziele zu kontrollieren.">Selbstdisziplin</button>
      <button class="glossar-term" data-id="selbstinszenierung" data-desc="Bewusste Gestaltung des eigenen Images in sozialen Medien.">Selbstinszenierung</button>
      <button class="glossar-term" data-id="selbstoptimierung" data-desc="Streben nach ständiger Verbesserung der eigenen Leistungsfähigkeit.">Selbstoptimierung</button>
      <button class="glossar-term" data-id="selbstregulation" data-desc="Fähigkeit, eigenes Verhalten und Emotionen zu steuern.">Selbstregulation</button>
      <button class="glossar-term" data-id="selbstwert" data-desc="Bewertung der eigenen Person – kann durch Social-Media-Vergleiche beeinflusst werden.">Selbstwert</button>
      <button class="glossar-term" data-id="selbstwirksamkeit" data-desc="Überzeugung, Herausforderungen aus eigener Kraft bewältigen zu können.">Selbstwirksamkeit</button>
      <button class="glossar-term" data-id="selektiveaufmerksamkeit" data-desc="Fähigkeit, relevante Reize zu fokussieren und irrelevante auszublenden.">Selektive Aufmerksamkeit</button>
      <button class="glossar-term" data-id="sensorischestimulation" data-desc="Anregung der Sinne durch Reize – in sozialen Medien oft intensiv gestaltet.">Sensorische Stimulation</button>
      <button class="glossar-term" data-id="sexting" data-desc="Austausch sexuell expliziter Nachrichten oder Bilder über digitale Kanäle.">Sexting</button>
      <button class="glossar-term" data-id="shadowbanning" data-desc="Unsichtbare Einschränkung der Reichweite eines Accounts ohne Benachrichtigung.">Shadow Banning</button>
      <button class="glossar-term" data-id="short" data-desc="Kurzvideoformat auf YouTube, inspiriert von TikTok.">Short</button>
      <button class="glossar-term" data-id="siliconvalley" data-desc="Region in Kalifornien, Zentrum der Tech-Industrie und Heimat vieler Social-Media-Konzerne.">Silicon Valley</button>
      <button class="glossar-term" data-id="smartphonesucht" data-desc="Zwanghafte, unkontrollierte Nutzung des Smartphones trotz negativer Konsequenzen.">Smartphonesucht</button>
      <button class="glossar-term" data-id="smombie" data-desc="Kofferwort aus „Smartphone&quot; und „Zombie&quot; – Person, die beim Gehen aufs Handy starrt.">Smombie</button>
      <button class="glossar-term" data-id="snapchat" data-desc="2011 gegründete Plattform für vergängliche Foto- und Videonachrichten.">Snapchat</button>
      <button class="glossar-term" data-id="snapchatdysmorphophobie" data-desc="Wunsch, im echten Leben wie das gefilterte Selbstbild auszusehen.">Snapchat-Dysmorphophobie</button>

    </div>
  </div>

  <script>
    const glossarItems = document.getElementById('glossar-items');
    const glossarTerms = document.querySelectorAll('.glossar-term');
    let activeDescEl = null;

    glossarTerms.forEach(term => {
      term.addEventListener('click', () => {
        const wasActive = term.classList.contains('active');
        
        // Entferne aktive Klasse von allen Begriffen
        glossarTerms.forEach(t => t.classList.remove('active'));
        
        // Entferne vorhandene Beschreibung
        if (activeDescEl) {
          activeDescEl.remove();
          activeDescEl = null;
        }
        
        // Wenn nicht bereits aktiv, zeige Beschreibung
        if (!wasActive) {
          term.classList.add('active');
          
          const desc = term.getAttribute('data-desc');
          if (desc) {
            // Erstelle Beschreibungs-Element
            activeDescEl = document.createElement('div');
            activeDescEl.className = 'glossar-description-inline';
            activeDescEl.innerHTML = '<p>' + desc + '</p>';
            
            // Fuege nach dem Begriff ein
            term.insertAdjacentElement('afterend', activeDescEl);
          }
        }
      });
    });

    // Theme aus localStorage wiederherstellen
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
