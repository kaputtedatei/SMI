  <div class="glossar-content">
    <div class="glossar-items" id="glossar-items">
      <button class="glossar-term" data-id="affordanzen" data-desc="Affordanzen bezeichnen die durch Plattformdesign vorgegebenen Handlungsmöglichkeiten für Nutzer:innen. Sie strukturieren, was sichtbar, sagbar und machbar ist – etwa Liken, Teilen oder Kommentieren. Affordanzen beeinflussen damit Kommunikation, Selbstinszenierung und Machtverhältnisse, ohne explizit vorgeschrieben zu sein. Jede Plattform entwickelt eigene Affordanzen, die das Nutzerverhalten subtil lenken. Das Verständnis von Affordanzen ist zentral für die kritische Analyse digitaler Umgebungen.">Affordanzen</button>
      <button class="glossar-term" data-id="algorithmus" data-desc="Ein Algorithmus ist eine regelbasierte Rechenvorschrift, die entscheidet, welche Inhalte Nutzer:innen sehen. In sozialen Medien analysiert er Verhalten, Interessen und soziale Netzwerke, um Feeds zu optimieren. Algorithmen sind zentrale Machtinstrumente der Plattformökonomie. Sie operieren meist intransparent und entziehen sich demokratischer Kontrolle. Ihre Entscheidungslogik prägt maßgeblich, welche Stimmen gehört werden und welche verstummen.">Algorithmus</button>
      <button class="glossar-term" data-id="algorithmicbias" data-desc="Algorithmic Bias beschreibt systematische Verzerrungen in algorithmischen Entscheidungssystemen. Diese entstehen durch Trainingsdaten, Designentscheidungen oder ökonomische Ziele. In sozialen Medien kann dies zu Diskriminierung, Unsichtbarkeit bestimmter Gruppen oder Verstärkung stereotyper Inhalte führen. Besonders marginalisierte Communities sind von diesen Verzerrungen betroffen. Die Bekämpfung von Algorithmic Bias erfordert diverse Entwicklerteams und kontinuierliche Überprüfung.">Algorithmic Bias</button>
      <button class="glossar-term" data-id="algorithmischekuratierung" data-desc="Algorithmische Kuratierung bezeichnet die automatisierte Auswahl, Gewichtung und Sortierung von Inhalten in Feeds. Grundlage sind Nutzungsdaten wie Klicks, Verweildauer oder Interaktionen. Dieser Prozess bestimmt maßgeblich, welche Themen sichtbar werden und prägt individuelle Wahrnehmung sowie öffentliche Diskurse. Im Gegensatz zur menschlichen Kuratierung fehlt hier oft Kontextwissen und redaktionelle Verantwortung. Nutzer:innen haben meist keinen Einblick in die Kriterien, nach denen Inhalte ausgewählt werden.">Algorithmische Kuratierung</button>
      <button class="glossar-term" data-category="psychologie" data-id="arbeitsgedaechtnis" data-desc="Kurzzeitspeicher des Gehirns für aktuelle Informationen. Wird durch ständige Benachrichtigungen überlastet. Das Arbeitsgedächtnis kann nur eine begrenzte Anzahl von Informationen gleichzeitig verarbeiten. Multitasking und permanente Unterbrechungen durch Social Media reduzieren seine Kapazität erheblich. Studien zeigen, dass bereits die Anwesenheit eines Smartphones die kognitive Leistung mindern kann.">Arbeitsgedächtnis</button>
      <button class="glossar-term" data-id="arfilter" data-desc="AR-Filter sind Augmented-Reality-Effekte, die Gesichter, Körper oder Umgebungen in Echtzeit verändern. Sie prägen ästhetische Normen, Selbstbilder und Trends auf Plattformen wie Instagram oder Snapchat. Gleichzeitig fördern sie performative Selbstdarstellung und visuelle Vereinheitlichung. Besonders problematisch ist ihr Einfluss auf das Körperbild junger Menschen. Viele AR-Filter reproduzieren eurozentristische Schönheitsideale und können Dysmorphie verstärken.">AR-Filter</button>
      <button class="glossar-term" data-id="audience" data-desc="Die Zielgruppe oder Followerschaft eines Social-Media-Accounts. Die Audience bestimmt maßgeblich, welche Inhalte erfolgreich sind und wie Creator:innen kommunizieren. Im Gegensatz zu traditionellen Medien ist die Audience auf Social Media oft sichtbar und interaktiv.">Audience</button>
      <button class="glossar-term" data-id="attentioneconomy" data-desc="Die Attention Economy beschreibt ein Wirtschaftsmodell, in dem menschliche Aufmerksamkeit zur knappen Ressource wird. Plattformen optimieren Inhalte gezielt auf Verweildauer und Engagement. Aufmerksamkeit bildet die Grundlage für Werbung, Datensammlung und ökonomische Macht. In diesem Modell konkurrieren alle Inhalte – von Nachrichten bis Unterhaltung – um dieselbe begrenzte Ressource. Die Konsequenz ist ein ständiger Wettlauf um immer intensivere Stimuli.">Attention Economy</button>
      <button class="glossar-term" data-category="psychologie" data-id="aufmerksamkeitsspanne" data-desc="Zeitraum, in dem sich eine Person auf eine Aufgabe konzentrieren kann. Durch Social Media nachweislich verkürzt. Die durchschnittliche Aufmerksamkeitsspanne bei digitalen Inhalten liegt inzwischen unter 10 Sekunden. Diese Entwicklung beeinflusst nicht nur Medienkonsum, sondern auch Lernfähigkeit und Arbeitsleistung.">Aufmerksamkeitsspanne</button>
      <button class="glossar-term" data-category="psychologie" data-id="backfireeffekt" data-desc="Phänomen, bei dem Gegenargumente die ursprüngliche Überzeugung verstärken statt sie zu schwächen. In sozialen Medien ist dieser Effekt besonders wirksam, da emotionale Reaktionen schnelles Engagement fördern. Das Verständnis dieses Effekts ist zentral für effektive Wissenschaftskommunikation und Faktenchecks.">Backfire-Effekt</button>
      <button class="glossar-term" data-category="psychologie" data-id="bestaetigungsfehler" data-desc="Tendenz, Informationen so auszuwählen, dass sie bestehende Überzeugungen bestätigen. Algorithmen verstärken diesen kognitiven Bias durch personalisierte Feeds. Der Bestätigungsfehler ist eine der Hauptursachen für Filterblasen und erschwert konstruktiven gesellschaftlichen Diskurs.">Bestätigungsfehler</button>
      <button class="glossar-term" data-id="bildschirmzeit" data-desc="Gesamtdauer der täglichen Nutzung digitaler Geräte. Wird zunehmend als Gesundheitsindikator betrachtet. Moderne Smartphones bieten integrierte Tools zur Überwachung der Bildschirmzeit. Studien zeigen Zusammenhänge zwischen hoher Bildschirmzeit und reduziertem Wohlbefinden, besonders bei Jugendlichen.">Bildschirmzeit</button>
      <button class="glossar-term" data-id="blogroll" data-desc="Eine Blogroll ist eine kuratierte Liste empfohlener Blogs, verbreitet in der frühen Blogosphäre. Sie diente als soziales Netzwerk vor algorithmischen Feeds. Blogrolls förderten Sichtbarkeit, Vernetzung und thematische Communities. Im Gegensatz zu heutigen Algorithmen war die Kuratierung transparent und menschlich gesteuert. Die Blogroll symbolisiert eine dezentralere Ära des Internets vor der Plattformhegemonie.">Blogroll</button>
      <button class="glossar-term" data-category="slang" data-id="brainrot" data-desc="Umgangssprachlich für geistige Abstumpfung durch übermäßigen Konsum seichter Online-Inhalte. Der Begriff wurde 2024 zum Oxford Word of the Year gewählt. Brain Rot beschreibt das Gefühl, durch endloses Scrollen die Fähigkeit zu tieferem Denken zu verlieren.">Brain Rot</button>
      <button class="glossar-term" data-category="slang" data-id="breadcrumbing" data-desc="Hinhaltetaktik in Online-Beziehungen durch sporadische, unverbindliche Nachrichten. Der Begriff stammt aus dem Märchen Hänsel und Gretel – kleine Brotkrumen, die keine echte Verbindung aufbauen. Breadcrumbing ist eine Form emotionaler Manipulation, die durch die Anonymität digitaler Kommunikation begünstigt wird.">Breadcrumbing</button>
      <button class="glossar-term" data-id="bubble" data-desc="Siehe Filterblase. Informationsraum, in dem nur gleichgesinnte Meinungen zirkulieren. Der Begriff betont die Abschottung von anderen Perspektiven. Bubbles entstehen sowohl durch algorithmische Kuratierung als auch durch bewusste Selektion der Nutzer:innen.">Bubble</button>
      <button class="glossar-term" data-id="cancelung" data-desc="Öffentlicher Boykott einer Person wegen moralisch fragwürdiger Aussagen oder Handlungen. Cancel Culture ist ein umstrittenes Phänomen zwischen berechtigter Kritik und digitalem Mob. Die Dynamiken von Cancelung zeigen die Macht kollektiver Empörung in sozialen Medien.">Cancelung</button>
      <button class="glossar-term" data-id="chatbot" data-desc="Software, die automatisiert Konversationen führt, oft auf Basis von KI. Moderne Chatbots wie ChatGPT nutzen Large Language Models für natürlichsprachige Interaktion. Sie werden zunehmend in Kundenservice, Therapie und Bildung eingesetzt, werfen aber Fragen zu Transparenz und menschlicher Ersetzung auf.">Chatbot</button>
      <button class="glossar-term" data-id="clicktivism" data-desc="Oberflächlicher Online-Aktivismus, der sich auf Likes und Shares beschränkt. Clicktivism erzeugt das Gefühl politischer Teilhabe ohne substanzielles Engagement. Kritiker:innen sehen darin eine Entpolitisierung, während andere es als niedrigschwelligen Einstieg in Aktivismus verteidigen.">Clicktivism</button>
      <button class="glossar-term" data-id="clickthroughrate" data-desc="Die Click-Through-Rate (CTR) misst das Verhältnis von Klicks zu Impressionen. Sie gilt als zentrale Leistungskennzahl im digitalen Marketing. Algorithmen nutzen sie zur Bewertung von Relevanz und Erfolg von Inhalten. Eine hohe CTR signalisiert, dass Inhalte Aufmerksamkeit erfolgreich in Handlung umwandeln. Die Optimierung auf CTR kann jedoch zu Clickbait und sensationalistischen Inhalten führen.">Click-Through-Rate (CTR)</button>
      <button class="glossar-term" data-id="cocreator" data-desc="Nutzer:in, die aktiv an der Erstellung von Inhalten mitwirkt. Co-Creation verwischt die Grenze zwischen Konsument:in und Produzent:in. Plattformen nutzen Co-Creator:innen, um kostengünstig Inhalte zu generieren und Community-Bindung zu stärken.">Co-Creator</button>
      <button class="glossar-term" data-id="contentcreator" data-desc="Person, die regelmäßig Inhalte für soziale Medien produziert. Content Creation ist zu einem anerkannten Beruf geworden, oft mit unregelmäßigem Einkommen und hohem Burnout-Risiko. Die Creator Economy umfasst inzwischen Millionen von Menschen weltweit.">Content Creator</button>
      <button class="glossar-term" data-id="contentmoderation" data-desc="Content Moderation umfasst die Prüfung, Kennzeichnung oder Entfernung von Inhalten. Sie erfolgt durch menschliche Moderator:innen, automatisierte Systeme oder hybride Modelle. Content Moderation ist zentral für Plattformverantwortung und Meinungsfreiheit. Die Arbeit menschlicher Moderator:innen ist oft traumatisierend und schlecht bezahlt. Gleichzeitig treffen sie täglich Entscheidungen mit weitreichenden Folgen für öffentliche Diskurse.">Content Moderation</button>
      <button class="glossar-term" data-id="contextcollapse" data-desc="Context Collapse beschreibt das Zusammenfallen unterschiedlicher sozialer Kontexte auf einer Plattform. Inhalte richten sich gleichzeitig an Familie, Freund:innen, Kolleg:innen und Öffentlichkeit. Dies erschwert authentische Kommunikation und fördert strategische Selbstinszenierung. Das Phänomen erklärt, warum viele Menschen zu Pseudonymen oder privaten Accounts wechseln. Context Collapse macht jede Äußerung potenziell riskant.">Context Collapse</button>
      <button class="glossar-term" data-category="psychologie" data-id="copingstrategie" data-desc="Methode zur Bewältigung von Stress oder negativen Emotionen. Social Media wird häufig als Coping-Strategie genutzt, ist aber oft kontraproduktiv. Gesunde Coping-Strategien umfassen Bewegung, soziale Kontakte und kreative Tätigkeiten abseits von Bildschirmen.">Coping-Strategie</button>
      <button class="glossar-term" data-category="slang" data-id="copium" data-desc="Internet-Slang für Selbstberuhigung nach Enttäuschungen oder Misserfolgen. Der Begriff kombiniert „Cope“ mit dem Suffix „-ium“ wie bei Opium. Copium-Memes ironisieren die menschliche Tendenz zur Rationalisierung und Selbsttäuschung."">Copium</button>
      <button class="glossar-term" data-category="slang" data-id="cringe" data-desc="Gefühl der Fremdscham bei peinlichen Inhalten oder Verhalten. Cringe-Content ist ein eigenes Genre auf Plattformen wie TikTok und Reddit. Die Empfindung von Cringe spiegelt soziale Normen und generationelle Unterschiede wider.">Cringe</button>
      <button class="glossar-term" data-id="crowdsourcing" data-desc="Auslagerung von Aufgaben an eine große Gruppe von Menschen über das Internet. Crowdsourcing nutzt die kollektive Intelligenz für Problemlösung, Finanzierung oder Content-Erstellung. Bekannte Beispiele sind Wikipedia, Kickstarter und Community-Notes auf X.">Crowdsourcing</button>
      <button class="glossar-term" data-category="psychologie" data-id="cue" data-desc="Auslösereiz, der ein bestimmtes Verhalten oder eine Gewohnheit triggert. Im Kontext sozialer Medien sind Benachrichtigungstöne, rote Badges und bestimmte Orte typische Cues. Das Bewusstsein für persönliche Cues ist der erste Schritt zur Verhaltensänderung.">Cue</button>
      <button class="glossar-term" data-id="cybergrooming" data-desc="Anbahnung sexueller Kontakte mit Minderjährigen über das Internet. Täter:innen nutzen die Anonymität und Zugänglichkeit sozialer Medien strategisch aus. Cybergrooming ist strafbar und erfordert verstärkte Aufklärung sowie technische Schutzmaßnahmen.">Cybergrooming</button>
      <button class="glossar-term" data-id="cybermobbing" data-desc="Systematische Belästigung oder Diffamierung einer Person über digitale Kanäle. Im Gegensatz zu traditionellem Mobbing endet Cybermobbing nicht am Schultor und erreicht potenziell unbegrenzte Öffentlichkeit. Die psychischen Folgen können gravierend sein und reichen bis zu Suizidalität.">Cybermobbing</button>
      <button class="glossar-term" data-id="cyberspace" data-desc="Virtueller Raum der vernetzten Computer und digitalen Kommunikation. Der Begriff wurde 1984 von William Gibson in seinem Roman Neuromancer geprägt. Heute verschmilzt der Cyberspace zunehmend mit der physischen Realität durch mobile Geräte und AR.">Cyberspace</button>
      <button class="glossar-term" data-id="cyberstalking" data-desc="Wiederholte Belästigung oder Verfolgung einer Person über digitale Medien. Cyberstalking umfasst unerwünschte Nachrichten, Überwachung und Identitätsdiebstahl. Es ist eine Form digitaler Gewalt, die überwiegend Frauen betrifft und strafrechtlich verfolgt wird.">Cyberstalking</button>
      <button class="glossar-term" data-id="darkpattern" data-desc="Manipulative Designelemente, die Nutzer:innen zu ungewollten Handlungen verleiten. Beispiele sind versteckte Kündigungsbuttons, vorausgewählte Optionen und Countdowns, die Dringlichkeit suggerieren. Die EU reguliert Dark Patterns zunehmend durch den Digital Services Act.">Dark Pattern</button>
      <button class="glossar-term" data-id="datamining" data-desc="Automatisierte Analyse großer Datenmengen zur Erkennung von Mustern. Data Mining ist die Grundlage für personalisierte Werbung und algorithmische Empfehlungen. Die gesammelten Erkenntnisse über Nutzerverhalten haben enormen wirtschaftlichen Wert.">Data Mining</button>
      <button class="glossar-term" data-id="debunking" data-desc="Widerlegung von Falschinformationen durch Faktenprüfung. Effektives Debunking erfordert klare Kommunikation und Berücksichtigung des Backfire-Effekts. Professionelle Faktenchecker:innen kämpfen gegen die Geschwindigkeit, mit der sich Falschinformationen verbreiten.">Debunking</button>
      <button class="glossar-term" data-id="deepfake" data-desc="KI-generiertes Video oder Bild, das Personen täuschend echt darstellt. Deepfakes werden für Desinformation, Betrug und nicht-konsensualen pornografischen Content missbraucht. Die Technologie entwickelt sich schneller als Erkennungsmethoden und rechtliche Regulierung.">Deepfake</button>
      <button class="glossar-term" data-id="deepnude" data-desc="KI-Software, die Nacktbilder aus bekleideten Fotos generiert – ohne Einwilligung. Dies ist eine Form bildbasierter sexualisierter Gewalt, die überwiegend Frauen betrifft. Viele Länder haben inzwischen spezifische Gesetze gegen solche Technologien erlassen.">Deepnude</button>
      <button class="glossar-term" data-id="digitaleamnesie" data-desc="Vergessen von Informationen, die digital gespeichert sind – weil das Gehirn sie nicht mehr behält. Das Phänomen wird auch als „Google-Effekt“ bezeichnet. Studien zeigen, dass Menschen sich eher merken, wo Information gespeichert ist, als die Information selbst.">Digitale Amnesie</button>
      <button class="glossar-term" data-id="digitalerdetox" data-desc="Bewusster Verzicht auf digitale Geräte für einen bestimmten Zeitraum. Digital Detox soll helfen, die Kontrolle über die eigene Mediennutzung zurückzugewinnen. Die Wirksamkeit ist umstritten – nachhaltige Veränderung erfordert meist strukturelle Anpassungen im Alltag.">Digitaler Detox</button>
      <button class="glossar-term" data-id="digitalerfussabdruck" data-desc="Gesamtheit aller online hinterlassenen Datenspuren einer Person. Der digitale Fußabdruck umfasst aktive Beiträge ebenso wie passive Metadaten. Er kann Jahrzehnte überdauern und hat Auswirkungen auf Reputation, Berufschancen und Privatsphäre.">Digitaler Fußabdruck</button>
      <button class="glossar-term" data-id="digitallabour" data-desc="Unbezahlte Arbeit, die Nutzer:innen durch ihre Aktivitäten für Plattformen leisten. Jeder Like, Kommentar und Klick produziert wertvolle Daten. Digital Labour kritisiert die Asymmetrie zwischen dem Wert, den Nutzer:innen schaffen, und der Vergütung, die sie erhalten.">Digital Labour</button>
      <button class="glossar-term" data-id="digitalnatives" data-desc="Generation, die mit digitalen Technologien aufgewachsen ist. Der Begriff suggeriert intuitives Technikverständnis, ignoriert aber oft Kompetenzunterschiede innerhalb der Generation. Digital Natives sind nicht automatisch medienkompetent.">Digital Natives</button>
      <button class="glossar-term" data-id="digitalerschnuller" data-desc="Einsatz von Smartphones zur Beruhigung von Kindern – mit fraglichen Langzeitfolgen. Diese Praxis verzögert möglicherweise die Entwicklung von Selbstregulationsfähigkeiten. Expert:innen empfehlen altersgerechte Bildschirmzeiten und begleitete Mediennutzung.">Digitaler Schnuller</button>
      <button class="glossar-term" data-id="dm" data-desc="Direct Message – private Nachricht auf Social-Media-Plattformen. DMs haben die E-Mail für viele Altersgruppen als primären Kommunikationskanal abgelöst. Sie ermöglichen sowohl persönliche Gespräche als auch unerwünschte Kontaktaufnahme.">DM</button>
      <button class="glossar-term" data-category="slang" data-id="doomscrolling" data-desc="Zwanghaftes Scrollen durch negative Nachrichten, obwohl es dem Wohlbefinden schadet. Der Begriff entstand während der COVID-19-Pandemie. Doomscrolling aktiviert den Negativity Bias und verstärkt Angst und Hilflosigkeit.">Doomscrolling</button>
      <button class="glossar-term" data-category="psychologie" data-id="dopaminausschuettung" data-desc="Freisetzung des Neurotransmitters Dopamin bei Belohnungsreizen – z.B. bei Likes. Dopamin signalisiert Belohnung und motiviert zur Wiederholung von Verhaltensweisen. Social-Media-Apps sind gezielt darauf ausgelegt, diese neurochemische Reaktion auszulösen.">Dopaminausschüttung</button>
      <button class="glossar-term" data-category="psychologie" data-id="dopaminfasten" data-desc="Bewusster Verzicht auf stimulierende Aktivitäten zur Wiederherstellung der Reizempfindlichkeit. Die Praxis stammt aus dem Silicon Valley und zielt auf „Reset“ des Belohnungssystems. Wissenschaftlich ist die Wirksamkeit umstritten, da Dopamin komplexer funktioniert als die Metapher suggeriert.">Dopaminfasten</button>
      <button class="glossar-term" data-category="psychologie" data-id="echokammer" data-desc="Geschlossener Kommunikationsraum, in dem nur übereinstimmende Meinungen verstärkt werden. Echokammern entstehen durch algorithmische Filterung und soziale Homophilie. Sie können Radikalisierung begünstigen und gesellschaftlichen Dialog erschweren.">Echokammer</button>
      <button class="glossar-term" data-category="psychologie" data-id="empathie" data-desc="Fähigkeit, sich in die Gefühle anderer hineinzuversetzen – online oft eingeschränkt. Die Abwesenheit nonverbaler Signale und physischer Präsenz erschwert empathische Reaktionen. Studien zeigen einen Rückgang der Empathiefähigkeit unter intensiven Social-Media-Nutzer:innen.">Empathie</button>
      <button class="glossar-term" data-id="facebook" data-desc="2004 gegründetes soziales Netzwerk, heute Teil des Meta-Konzerns. Über 3 Milliarden Nutzer:innen. Facebook war Pionier des Social-Media-Geschäftsmodells und prägte Konzepte wie den Newsfeed. Heute kämpft die Plattform mit alternder Nutzerschaft und Vertrauenskrisen nach Datenskandalen.">Facebook</button>
      <button class="glossar-term" data-id="fakenews" data-desc="Absichtlich verbreitete Falschinformationen, oft mit manipulativer Absicht. Fake News verbreiten sich auf Social Media schneller als faktische Informationen. Die Bekämpfung erfordert Medienkompetenz, Faktenchecking und plattformseitige Maßnahmen.">Fake News</button>
      <button class="glossar-term" data-id="flamewar" data-desc="Ein Flame War ist eine eskalierende Online-Auseinandersetzung, geprägt von Beleidigungen und Provokationen. Er war besonders in frühen Foren und Kommentarspalten verbreitet. Flame Wars zeigen Konfliktdynamiken digitaler Öffentlichkeit. Die Anonymität des Internets senkt Hemmschwellen für aggressive Kommunikation. Moderationsregeln und Community Guidelines entstanden als Reaktion auf diese Dynamiken.">Flame War</button>
      <button class="glossar-term" data-category="psychologie" data-id="flow" data-desc="Zustand völliger Vertiefung in eine Tätigkeit. Wird durch ständige Unterbrechungen gestört. Flow erfordert etwa 15-20 Minuten ungestörte Konzentration zum Eintritt. Benachrichtigungen und die Verfügbarkeit sozialer Medien verhindern oft das Erreichen dieses produktiven Zustands.">Flow</button>
      <button class="glossar-term" data-category="psychologie" data-id="fomo" data-desc="Fear Of Missing Out – Angst, etwas zu verpassen. Verstärkt durch soziale Medien. FOMO entsteht durch den ständigen Vergleich mit kuratierten Darstellungen anderer Leben. Die Angst führt zu kompulsivem Checking und kann Wohlbefinden signifikant beeinträchtigen.">FOMO</button>
      <button class="glossar-term" data-id="foryoupage" data-desc="Personalisierter Feed auf TikTok, der algorithmisch kuratierte Inhalte zeigt. Die For You Page ist das Herzstück des TikTok-Erlebnisses und Hauptgrund für die Plattformsucht. Sie analysiert Sekundenbruchteile von Nutzerverhalten, um Inhalte zu optimieren.">For You Page</button>
      <button class="glossar-term" data-id="gamification" data-desc="Einsatz spielerischer Elemente in nicht-spielerischen Kontexten zur Motivationssteigerung. Social-Media-Plattformen nutzen Gamification durch Punkte, Badges und Streaks. Diese Mechanismen aktivieren das Belohnungssystem und können abhängig machendes Verhalten fördern.">Gamification</button>
      <button class="glossar-term" data-id="genz" data-desc="Generation der zwischen 1997 und 2012 Geborenen – erste vollständig digital sozialisierte Generation. Gen Z zeichnet sich durch native Social-Media-Kompetenz, aber auch erhöhte Raten psychischer Belastungen aus. Ihre Mediennutzung unterscheidet sich fundamental von älteren Generationen.">Gen Z</button>
      <button class="glossar-term" data-id="geotargeting" data-desc="Standortbasierte Auslieferung von Werbung oder Inhalten. Geotargeting ermöglicht lokalisierte Marketingkampagnen und standortbezogene Services. Es wirft Fragen zum Datenschutz und zur Überwachung auf, da Bewegungsprofile erstellt werden können.">Geotargeting</button>
      <button class="glossar-term" data-category="psychologie" data-id="gewohnheit" data-desc="Automatisiertes Verhaltensmuster, das durch Wiederholung entsteht. Gewohnheiten operieren unterhalb der bewussten Entscheidungsebene und sind schwer zu ändern. Social-Media-Apps sind darauf optimiert, Nutzungsgewohnheiten zu etablieren.">Gewohnheit</button>
      <button class="glossar-term" data-id="ghostwriter" data-desc="Person, die Texte im Namen anderer verfasst – auch für Influencer:innen. Viele große Accounts beschäftigen Teams, die Content produzieren. Dies wirft Fragen zur Authentizität von Influencer-Marketing auf.">Ghostwriter</button>
      <button class="glossar-term" data-category="slang" data-id="granfluencer" data-desc="Ältere Influencer:innen (meist 60+), die in sozialen Medien aktiv sind. Granfluencer brechen Altersstereotype und erreichen oft generationenübergreifende Audiences. Sie zeigen, dass Social-Media-Erfolg nicht altersgebunden ist.">Granfluencer</button>
      <button class="glossar-term" data-id="growthhacking" data-desc="Experimentelle Marketingstrategien für schnelles Nutzerwachstum. Growth Hacking priorisiert Skalierung über nachhaltige Entwicklung. Viele heute kontroverse Features wurden ursprünglich als Growth Hacks eingeführt.">Growth Hacking</button>
      <button class="glossar-term" data-id="hatespeech" data-desc="Hassrede – Äußerungen, die Gruppen oder Einzelpersonen herabsetzen oder bedrohen. Hate Speech ist auf Social Media weit verbreitet und schwer zu moderieren. Betroffene leiden unter erheblichen psychischen Folgen, während Plattformen mit effektiver Bekämpfung kämpfen.">Hate Speech</button>
      <button class="glossar-term" data-id="hedonist" data-desc="Person, die Lustmaximierung als Lebensprinzip verfolgt. Social Media bedient hedonistische Impulse durch sofortige Gratifikation. Der hedonistische Charakter vieler Plattformdesigns steht im Konflikt mit langfristigen Lebenszielen.">Hedonist</button>
      <button class="glossar-term" data-id="hookupculture" data-desc="Kultur unverbindlicher sexueller Begegnungen, oft durch Dating-Apps begünstigt. Die Gamification des Datings durch Swipe-Mechaniken verändert Beziehungsanbahnung fundamental. Kritiker:innen sehen eine Kommerzialisierung von Intimität.">Hookup Culture</button>
      <button class="glossar-term" data-id="ikigai" data-desc="Japanisches Konzept für den persönlichen Lebenssinn – Schnittmenge aus Leidenschaft, Berufung, Mission und Beruf. Ikigai wird in westlichen Social-Media-Kontexten oft vereinfacht dargestellt. Das Konzept betont die Bedeutung von Purpose jenseits kurzfristiger Belohnungen.">Ikigai</button>
      <button class="glossar-term" data-category="psychologie" data-id="impulsivitaet" data-desc="Neigung zu schnellen, unüberlegten Handlungen – wird durch Social Media gefördert. Die sofortige Verfügbarkeit von Reaktionsmöglichkeiten begünstigt impulsives Verhalten. Besonders bei Jugendlichen mit noch unreifem präfrontalem Kortex ist dies problematisch.">Impulsivität</button>
      <button class="glossar-term" data-id="individualmedien" data-desc="Medien für die Kommunikation zwischen Einzelpersonen, z.B. Messenger. Individualmedien ermöglichen private Gespräche abseits öffentlicher Feeds. Die Grenze zwischen Individual- und Massenmedien verschwimmt auf hybriden Plattformen zunehmend.">Individualmedien</button>
      <button class="glossar-term" data-id="infinitescroll" data-desc="Designprinzip, bei dem Inhalte endlos nachladen – hält Nutzer:innen länger auf der Plattform. Infinite Scroll entfernt natürliche Stoppsignale und fördert passiven Konsum. Die Technik gilt als eine der manipulativsten Designentscheidungen sozialer Medien.">Infinite Scroll</button>
      <button class="glossar-term" data-id="influencer" data-desc="Person mit großer Reichweite, die Meinungen und Kaufentscheidungen beeinflusst. Influencer Marketing ist eine Milliarden-Industrie mit eigenen Agenturen und Vertragsstrukturen. Die Authentizität von Influencer-Empfehlungen wird zunehmend kritisch hinterfragt.">Influencer</button>
      <button class="glossar-term" data-id="instagram" data-desc="2010 gegründete Foto- und Video-Plattform, seit 2012 Teil von Meta. Instagram hat visuelle Kultur und Selbstdarstellung fundamental verändert. Interne Studien zeigen negative Auswirkungen auf das Körperbild, besonders bei jungen Frauen.">Instagram</button>
      <button class="glossar-term" data-category="slang" data-id="instagrammable" data-desc="Bezeichnung für Orte oder Momente, die sich besonders gut für Instagram-Fotos eignen. Das Streben nach Instagrammable-Momenten verändert Reise-, Konsum- und Freizeitverhalten. Es entsteht eine Ökonomie, die auf visuelle Teilbarkeit optimiert ist.">Instagrammable</button>
      <button class="glossar-term" data-id="interaktionsstoerung" data-desc="Beeinträchtigung zwischenmenschlicher Kommunikation durch Smartphone-Nutzung. Bereits die sichtbare Anwesenheit eines Smartphones kann Gesprächsqualität reduzieren. Dieses Phänomen wird auch als „Phubbing“ (Phone-Snubbing) bezeichnet.">Interaktionsstörung</button>
      <button class="glossar-term" data-category="psychologie" data-id="intimitaetsmotiv" data-desc="Grundbedürfnis nach Nähe und vertrauensvollen Beziehungen. Social Media verspricht, dieses Bedürfnis zu erfüllen, liefert aber oft nur oberflächliche Verbindungen. Die Diskrepanz kann zu Einsamkeit trotz hoher Online-Aktivität führen.">Intimitätsmotiv</button>
      <button class="glossar-term" data-category="psychologie" data-id="kognitivedissonanz" data-desc="Unangenehmes Gefühl bei widersprüchlichen Überzeugungen oder Handlungen. Social-Media-Nutzer:innen erleben kognitive Dissonanz, wenn ihr Wissen über Plattformschädlichkeit und ihr Nutzungsverhalten auseinanderklaffen. Die Auflösung erfolgt oft durch Rationalisierung statt Verhaltensänderung.">Kognitive Dissonanz</button>
      <button class="glossar-term" data-category="psychologie" data-id="konditionierung" data-desc="Lernprozess, bei dem Verhaltensweisen durch Belohnung oder Bestrafung verstärkt werden. Social-Media-Apps nutzen operante Konditionierung durch variable Belohnungen wie Likes. Dieser Mechanismus ist dem von Spielautomaten verwandt und kann abhängig machendes Verhalten erzeugen.">Konditionierung</button>
      <button class="glossar-term" data-id="lifelogging" data-desc="Kontinuierliche Dokumentation des eigenen Lebens durch digitale Aufzeichnungen. Lifelogging umfasst alles von täglichen Social-Media-Posts bis zu Wearable-Daten. Es wirft Fragen zu Privatsphäre, Authentizität und dem Verhältnis von Erleben und Dokumentieren auf.">Lifelogging</button>
      <button class="glossar-term" data-category="slang" data-id="lurker" data-desc="Passive Nutzer:in, die Inhalte konsumiert, aber nicht selbst beiträgt. Die Mehrheit der Social-Media-Nutzer:innen sind Lurker – die 90-9-1-Regel beschreibt dieses Ungleichgewicht. Lurking kann eine bewusste Strategie sein, um Privatsphäre zu wahren.">Lurker</button>
      <button class="glossar-term" data-id="machinelearning" data-desc="Teilbereich der KI, bei dem Systeme aus Daten lernen und sich verbessern. Machine Learning ist die Grundlage für Empfehlungsalgorithmen und Content Moderation. Die Systeme können Bias aus Trainingsdaten übernehmen und verstärken.">Machine Learning</button>
      <button class="glossar-term" data-id="massenmedien" data-desc="Medien, die Inhalte an ein großes, disperses Publikum verbreiten. Traditionelle Massenmedien waren hierarchisch organisiert mit klarer Sender-Empfänger-Struktur. Social Media verwischt diese Grenze, behält aber Aspekte massenmedialer Logik bei.">Massenmedien</button>
      <button class="glossar-term" data-id="massenkonsum" data-desc="Standardisierter Konsum von Gütern und Inhalten durch große Bevölkerungsgruppen. Social Media fördert Massenkonsum durch Trends, Influencer Marketing und gezielte Werbung. Gleichzeitig ermöglicht es Nischenmärkte und personalisierte Produkte.">Massenkonsum</button>
      <button class="glossar-term" data-id="medienkompetenz" data-desc="Fähigkeit, Medien kritisch zu analysieren, zu verstehen und sinnvoll zu nutzen. Medienkompetenz ist eine Kernkompetenz des 21. Jahrhunderts und umfasst technische, analytische und ethische Dimensionen. Sie sollte systematisch in Bildungssystemen vermittelt werden.">Medienkompetenz</button>
      <button class="glossar-term" data-id="medienpsychologie" data-desc="Wissenschaft von den psychologischen Wirkungen von Medien auf Menschen. Medienpsychologie untersucht Nutzungsmotive, Wirkungen und Suchtpotenziale. Ihre Erkenntnisse sind zentral für die Entwicklung gesunder Mediennutzungsstrategien.">Medienpsychologie</button>
      <button class="glossar-term" data-id="memekultur" data-desc="Kulturelle Praxis des Erstellens und Teilens von Memes als Kommunikationsform. Memes sind eine eigenständige Sprache mit eigenen Grammatiken und Referenzsystemen. Sie ermöglichen komplexe soziale Kommentare in komprimierter, teilbarer Form.">Meme-Kultur</button>
      <button class="glossar-term" data-id="messenger" data-desc="Anwendung für Echtzeitkommunikation, z.B. WhatsApp, Telegram, Signal. Messenger haben SMS weitgehend ersetzt und sind für viele Menschen der primäre Kommunikationskanal. Sie verbinden Privatheit mit Plattformabhängigkeit und Datenschutzfragen.">Messenger</button>
      <button class="glossar-term" data-id="meta" data-desc="Mutterkonzern von Facebook, Instagram und WhatsApp. Seit 2021 unter diesem Namen. Die Umbenennung signalisierte den Fokus auf das Metaverse und sollte von Reputationsproblemen ablenken. Meta kontrolliert einen Großteil der globalen Social-Media-Infrastruktur.">Meta</button>
      <button class="glossar-term" data-id="metadaten" data-desc="Daten über Daten – z.B. Zeitstempel, Standort, Geräteinformationen. Metadaten können mehr über Personen verraten als Inhalte selbst. Sie ermöglichen detaillierte Verhaltens- und Bewegungsprofile auch ohne Zugriff auf Kommunikationsinhalte.">Metadaten</button>
      <button class="glossar-term" data-id="metrik" data-desc="Messbare Kennzahl zur Bewertung von Erfolg, z.B. Likes, Reichweite, Engagement. Metriken prägen, was als wertvoll gilt, und können zu obsessivem Tracking führen. Die Fokussierung auf quantifizierbare Erfolge kann qualitative Aspekte verdrängen.">Metrik</button>
      <button class="glossar-term" data-id="millennial" data-desc="Generation der zwischen 1981 und 1996 Geborenen. Millennials erlebten den Aufstieg sozialer Medien als junge Erwachsene. Sie sind oft zwischen digitaler Begeisterung und kritischer Reflexion gespalten.">Millennial</button>
      <button class="glossar-term" data-id="mit" data-desc="Massachusetts Institute of Technology – führende Forschungsuniversität für Technologie. Das MIT Media Lab hat zentrale Konzepte für Social Media entwickelt. Gleichzeitig kamen von dort wichtige kritische Stimmen zur Technologiefolgenabschätzung.">MIT</button>
      <button class="glossar-term" data-id="mobilehealth" data-desc="Gesundheitsbezogene Anwendungen und Dienste auf mobilen Geräten. Mobile Health umfasst Fitness-Tracker, Meditations-Apps und Telemedizin. Der Markt wächst rasant, wirft aber Fragen zu Datenschutz und Wirksamkeit auf.">Mobile Health</button>
      <button class="glossar-term" data-category="psychologie" data-id="moodmanagementtheorie" data-desc="Theorie, dass Menschen Medien nutzen, um ihre Stimmung zu regulieren. Social Media wird häufig zur kurzfristigen Stimmungsaufhellung genutzt. Langfristig kann diese Strategie jedoch kontraproduktiv sein und Vermeidungsverhalten fördern.">Mood-Management-Theorie</button>
      <button class="glossar-term" data-category="psychologie" data-id="negativitybias" data-desc="Psychologische Tendenz, negativen Informationen mehr Gewicht zu geben als positiven. Algorithmen nutzen den Negativity Bias, da negative Inhalte mehr Engagement erzeugen. Dies führt zu einer Überrepräsentation negativer Nachrichten in Feeds.">Negativity Bias</button>
      <button class="glossar-term" data-id="newsfeed" data-desc="Zentrale Übersicht aktueller Inhalte auf einer Social-Media-Plattform. Der Newsfeed wurde von Facebook popularisiert und ist heute Standard auf den meisten Plattformen. Seine algorithmische Kuratierung bestimmt, welche Inhalte Aufmerksamkeit erhalten.">Newsfeed</button>
      <button class="glossar-term" data-category="psychologie" data-id="nomophobia" data-desc="Angst, ohne Mobiltelefon zu sein – Kunstwort aus „No Mobile Phone Phobia&quot;. Nomophobia zeigt sich in Panikgefühlen bei niedrigem Akkustand oder fehlendem Netz. Sie ist ein Symptom der psychologischen Abhängigkeit von digitaler Konnektivität.">Nomophobia</button>
      <button class="glossar-term" data-category="psychologie" data-id="nudging" data-desc="Sanfte Beeinflussung von Entscheidungen durch Gestaltung der Wahlarchitektur. Social-Media-Plattformen nutzen Nudging, um gewünschtes Nutzerverhalten zu fördern. Die Technik kann sowohl manipulativ als auch zum Wohl der Nutzer:innen eingesetzt werden.">Nudging</button>
      <button class="glossar-term" data-id="onlinedating" data-desc="Partnersuche über digitale Plattformen und Apps. Online-Dating hat die traditionelle Partnersuche revolutioniert und ist heute der häufigste Weg, Partner:innen kennenzulernen. Die Gamification und Optimierung menschlicher Beziehungen ist jedoch umstritten.">Onlinedating</button>
      <button class="glossar-term" data-category="psychologie" data-id="parasozialeinteraktion" data-desc="Parasoziale Interaktion beschreibt einseitige emotionale Beziehungen zu medialen Persönlichkeiten. Social Media intensiviert diese Bindung durch scheinbare Nähe und Dauerpräsenz. Sie beeinflusst Vertrauen, Identifikation und Konsumverhalten. Follower:innen entwickeln oft das Gefühl, Influencer:innen persönlich zu kennen. Diese Illusion von Intimität ist ein zentrales Element des Influencer-Marketings.">Parasoziale Interaktion</button>
      <button class="glossar-term" data-id="polarisierung" data-desc="Verstärkung extremer Positionen in der Gesellschaft – oft durch Algorithmen begünstigt. Polarisierung entsteht, wenn Feeds extreme Inhalte bevorzugen, weil diese mehr Engagement erzeugen. Die Folge sind fragmentierte Öffentlichkeiten und erschwerte gesellschaftliche Kompromissfindung.">Polarisierung</button>
      <button class="glossar-term" data-id="popup" data-desc="Fenster, das sich automatisch öffnet – oft für Werbung oder Benachrichtigungen. Pop-Ups unterbrechen gezielt den Nutzungsfluss und fordern sofortige Aufmerksamkeit. Sie sind ein Beispiel für aggressive Aufmerksamkeitsökonomie im Webdesign.">Pop-Up</button>
      <button class="glossar-term" data-id="populismus" data-desc="Politische Strategie, die „das Volk&quot; gegen „die Elite&quot; inszeniert – oft in sozialen Medien verbreitet. Social Media bietet populistischer Kommunikation ideale Bedingungen durch Direktheit und Emotionalisierung. Die Plattformlogik begünstigt vereinfachende, polarisierende Botschaften.">Populismus</button>
      <button class="glossar-term" data-id="postdigitalitaet" data-desc="Zustand, in dem das Digitale so alltäglich ist, dass es nicht mehr als besonders wahrgenommen wird. Postdigitalität beschreibt die Normalisierung digitaler Technologien im Alltag. Die Unterscheidung zwischen online und offline wird zunehmend obsolet.">Postdigitalität</button>
      <button class="glossar-term" data-category="psychologie" data-id="praefrontalerkortex" data-desc="Hirnregion für Impulskontrolle, Planung und rationales Denken – reift erst mit ca. 25 Jahren aus. Die Unreife des präfrontalen Kortex macht Jugendliche besonders anfällig für Social-Media-Sucht. Diese neurobiologische Tatsache hat Implikationen für Altersfreigaben und Plattformdesign.">Präfrontaler Kortex</button>
      <button class="glossar-term" data-id="prebunking" data-desc="Präventive Aufklärung über Manipulationstechniken, bevor Falschinformationen auftreten. Prebunking gilt als effektiver als nachträgliches Debunking. Es stärkt die Resilienz gegen Desinformation durch Vermittlung kritischer Medienkompetenz.">Prebunking</button>
      <button class="glossar-term" data-id="produktplatzierung" data-desc="Integration von Markenprodukten in Inhalte – oft als Werbung gekennzeichnet. Produktplatzierung im Influencer-Marketing verwischt die Grenze zwischen Inhalt und Werbung. Transparenzvorschriften verlangen zunehmend klare Kennzeichnung.">Produktplatzierung</button>
      <button class="glossar-term" data-id="profitmaximierung" data-desc="Wirtschaftliches Ziel, den Gewinn zu maximieren – Antrieb vieler Plattformdesigns. Profitmaximierung erklärt, warum Plattformen Features entwickeln, die Nutzung fördern, auch wenn sie schaden. Die Spannung zwischen Profit und Nutzerwohl ist ein zentrales ethisches Problem.">Profitmaximierung</button>
      <button class="glossar-term" data-category="psychologie" data-id="prokrastination" data-desc="Aufschieben wichtiger Aufgaben zugunsten kurzfristiger Belohnungen – z.B. Social Media. Social Media ist eine der häufigsten Prokrastinationsquellen. Der sofortige Dopamin-Kick ist attraktiver als die verzögerte Belohnung durch erledigte Arbeit.">Prokrastination</button>
      <button class="glossar-term" data-id="prosument" data-desc="Person, die gleichzeitig Produzent:in und Konsument:in von Inhalten ist. Der Prosument ist das Leitbild des Web 2.0 und sozialer Medien. Die Verwischung dieser Rollen demokratisiert Medienproduktion, schafft aber auch unbezahlte Arbeit für Plattformen.">Prosument</button>
      <button class="glossar-term" data-id="pushbenachrichtigung" data-desc="Automatische Nachricht, die auf dem Bildschirm erscheint – oft als Aufmerksamkeitsfalle. Push-Benachrichtigungen unterbrechen Konzentration und fördern zwanghaftes Checking. Die Deaktivierung ist eine der effektivsten Maßnahmen zur Reduktion problematischer Nutzung.">Push-Benachrichtigung</button>
      <button class="glossar-term" data-category="slang" data-id="rabbithole" data-desc="Metapher für das tiefe Eintauchen in zusammenhängende Inhalte – oft algorithmisch gesteuert. Rabbit Holes können zu stundenlangem Konsum führen, oft in Richtung extremerer Inhalte. Sie sind ein Nebeneffekt von Empfehlungsalgorithmen, die Engagement maximieren.">Rabbithole</button>
      <button class="glossar-term" data-id="reachdecay" data-desc="Reach Decay bezeichnet den schrittweisen Rückgang organischer Reichweite von Inhalten. Plattformen drosseln Sichtbarkeit zugunsten bezahlter Inhalte. Dies zwingt Creator:innen und Marken zu strategischer Anpassung. Der Effekt ist ein direktes Ergebnis der Monetarisierungsstrategie von Plattformen. Wer Reichweite will, muss zunehmend dafür bezahlen.">Reach Decay</button>
      <button class="glossar-term" data-id="reddit" data-desc="2005 gegründete Plattform für themenbasierte Diskussionsforen (Subreddits). Reddit ist bekannt für seine aktive Community-Moderation und virale Inhalte. Die Plattform hat einflussreiche Internet-Subkulturen hervorgebracht und gilt als „Front Page of the Internet".">Reddit</button>
      <button class="glossar-term" data-id="reel" data-desc="Kurzvideoformat auf Instagram, inspiriert von TikTok. Reels sind Metas Antwort auf den Erfolg von TikTok und werden vom Algorithmus bevorzugt. Sie verdrängen zunehmend klassische Foto-Posts und Stories.">Reel</button>
      <button class="glossar-term" data-id="reichweite" data-desc="Anzahl der Personen, die einen Inhalt potenziell sehen können. Reichweite ist eine zentrale Währung sozialer Medien und bestimmt den Wert von Accounts. Sie ist allerdings nicht gleichzusetzen mit tatsächlichem Einfluss oder Engagement.">Reichweite</button>
      <button class="glossar-term" data-category="psychologie" data-id="reizueberflutung" data-desc="Überforderung durch zu viele gleichzeitige Sinneseindrücke. Reizüberflutung ist ein ständiger Begleiter intensiver Social-Media-Nutzung. Sie kann zu Erschöpfung, Konzentrationsproblemen und emotionaler Abstumpfung führen.">Reizüberflutung</button>
      <button class="glossar-term" data-id="relativismus" data-desc="Ansicht, dass Wahrheit und Werte kontextabhängig sind – kann Faktenleugnung begünstigen. In sozialen Medien wird Relativismus oft als „alternative Fakten“ oder „eigene Meinung“ getarnt. Er untergräbt gemeinsame Wissensgrundlagen und erschwert Faktenchecking.">Relativismus</button>
      <button class="glossar-term" data-category="psychologie" data-id="routine" data-desc="Regelmäßig wiederholte Verhaltensabfolge – kann bewusst für Digital Wellbeing gestaltet werden. Routinen reduzieren Entscheidungsaufwand und können positive Gewohnheiten stabilisieren. Bewusstes Routine-Design ist ein Schlüssel zur gesunden Mediennutzung.">Routine</button>
      <button class="glossar-term" data-category="psychologie" data-id="salienterreiz" data-desc="Auffälliger Stimulus, der automatisch Aufmerksamkeit anzieht. Social-Media-Plattformen sind voller salienter Reize wie rote Benachrichtigungspunkte oder bewegte Bilder. Diese Designentscheidungen nutzen grundlegende neurologische Mechanismen aus.">Salienter Reiz</button>
      <button class="glossar-term" data-id="secondscreen" data-desc="Nutzung eines zweiten Bildschirms (meist Smartphone) parallel zum Fernsehen. Second Screen ist zur Standardpraxis geworden und fragmentiert Aufmerksamkeit. Es ermöglicht aber auch interaktive TV-Erlebnisse und Social Viewing.">Second Screen</button>
      <button class="glossar-term" data-category="psychologie" data-id="selbstdisziplin" data-desc="Fähigkeit, kurzfristige Impulse zugunsten langfristiger Ziele zu kontrollieren. Selbstdisziplin ist eine begrenzte Ressource, die durch ständige Entscheidungen erschöpft wird. Social-Media-Apps fordern diese Ressource permanent heraus.">Selbstdisziplin</button>
      <button class="glossar-term" data-id="selbstinszenierung" data-desc="Bewusste Gestaltung des eigenen Images in sozialen Medien. Selbstinszenierung ist keine neue Praxis, wird durch Social Media aber intensiviert und quantifiziert. Sie kann zu authentizitätsbezogenen Spannungen und Erschöpfung führen.">Selbstinszenierung</button>
      <button class="glossar-term" data-id="selbstoptimierung" data-desc="Streben nach ständiger Verbesserung der eigenen Leistungsfähigkeit. Social Media fördert Selbstoptimierungskultur durch Vergleiche und Tracking. Die permanente Verbesserungslogik kann zu Erschöpfung und Selbstwertproblemen führen.">Selbstoptimierung</button>
      <button class="glossar-term" data-category="psychologie" data-id="selbstregulation" data-desc="Fähigkeit, eigenes Verhalten und Emotionen zu steuern. Selbstregulation ist entscheidend für gesunde Social-Media-Nutzung. Sie kann trainiert werden, wird aber durch Plattformdesigns systematisch untergraben.">Selbstregulation</button>
      <button class="glossar-term" data-category="psychologie" data-id="selbstwert" data-desc="Bewertung der eigenen Person – kann durch Social-Media-Vergleiche beeinflusst werden. Studien zeigen Zusammenhänge zwischen intensiver Social-Media-Nutzung und niedrigem Selbstwert. Besonders der Vergleich mit kuratierten Selbstdarstellungen anderer ist problematisch.">Selbstwert</button>
      <button class="glossar-term" data-category="psychologie" data-id="selbstwirksamkeit" data-desc="Überzeugung, Herausforderungen aus eigener Kraft bewältigen zu können. Hohe Selbstwirksamkeit schützt vor problematischer Social-Media-Nutzung. Sie kann durch positive Erfahrungen und realistisches Feedback gestärkt werden.">Selbstwirksamkeit</button>
      <button class="glossar-term" data-category="psychologie" data-id="selektiveaufmerksamkeit" data-desc="Fähigkeit, relevante Reize zu fokussieren und irrelevante auszublenden. Selektive Aufmerksamkeit wird durch ständige Benachrichtigungen und Multitasking geschwächt. Die Wiederherstellung dieser Fähigkeit erfordert bewusste Praxis und Umgebungsgestaltung.">Selektive Aufmerksamkeit</button>
      <button class="glossar-term" data-category="psychologie" data-id="sensorischestimulation" data-desc="Anregung der Sinne durch Reize – in sozialen Medien oft intensiv gestaltet. Plattformen nutzen visuelle und auditive Stimulation, um Aufmerksamkeit zu binden. Diese Überstimulation kann zu Abstumpfung und Langeweile bei weniger intensiven Reizen führen.">Sensorische Stimulation</button>
      <button class="glossar-term" data-id="sexting" data-desc="Austausch sexuell expliziter Nachrichten oder Bilder über digitale Kanäle. Sexting unter Erwachsenen ist legal, birgt aber Risiken bei Weiterverbreitung. Bei Minderjährigen ist es strafbar und kann schwere psychische Folgen haben.">Sexting</button>
      <button class="glossar-term" data-id="shadowbanning" data-desc="Unsichtbare Einschränkung der Reichweite eines Accounts ohne Benachrichtigung. Shadow Banning ist intransparent und ermöglicht subtile Zensur. Betroffene merken oft erst spät, dass ihre Inhalte weniger Sichtbarkeit erhalten.">Shadow Banning</button>
      <button class="glossar-term" data-id="short" data-desc="Kurzvideoformat auf YouTube, inspiriert von TikTok. Shorts sind YouTubes Antwort auf den Kurzvideo-Trend und erreichen oft höhere View-Zahlen als klassische Videos. Sie verändern die Plattformkultur in Richtung kürzerer Aufmerksamkeitsspannen.">Short</button>
      <button class="glossar-term" data-id="siliconvalley" data-desc="Region in Kalifornien, Zentrum der Tech-Industrie und Heimat vieler Social-Media-Konzerne. Die Kultur des Silicon Valley prägt das Design und die Geschäftsmodelle sozialer Medien. Kritiker:innen bemängeln eine homogene, profit-orientierte Perspektive auf Technologie.">Silicon Valley</button>
      <button class="glossar-term" data-category="psychologie" data-id="smartphonesucht" data-desc="Zwanghafte, unkontrollierte Nutzung des Smartphones trotz negativer Konsequenzen. Smartphonesucht teilt Merkmale mit Verhaltensabhängigkeiten wie Toleranzentwicklung und Entzugssymptome. Die Klassifikation als Sucht ist wissenschaftlich noch umstritten.">Smartphonesucht</button>
      <button class="glossar-term" data-category="slang" data-id="smombie" data-desc="Kofferwort aus „Smartphone&quot; und „Zombie&quot; – Person, die beim Gehen aufs Handy starrt. Smombies sind ein Sicherheitsrisiko im Straßenverkehr. Einige Städte haben spezielle Warnsysteme oder Bußgelder eingeführt.">Smombie</button>
      <button class="glossar-term" data-id="snapchatdysmorphophobie" data-desc="Wunsch, im echten Leben wie das gefilterte Selbstbild auszusehen. Dieses Phänomen hat zu einem Anstieg kosmetischer Eingriffe geführt. Es zeigt, wie AR-Filter reale Körperwahrnehmung und Schönheitsideale beeinflussen.">Snapchat-Dysmorphophobie</button>
      <button class="glossar-term" data-id="socialbot" data-desc="Automatisierter Account, der menschliches Verhalten imitiert. Social Bots werden für Manipulation, Spam und künstliche Reichweite eingesetzt. Sie sind oft schwer von echten Accounts zu unterscheiden und untergraben Vertrauen in Online-Diskurse.">Social Bot</button>
      <button class="glossar-term" data-id="socialengineer" data-desc="Person, die psychologische Manipulation nutzt, um an vertrauliche Informationen zu gelangen. Social Engineering ist eine der größten Sicherheitsbedrohungen, da es menschliche Schwächen statt technische Lücken ausnutzt. Phishing und Pretexting sind häufige Methoden.">Social Engineer</button>
      <button class="glossar-term" data-category="psychologie" data-id="socialproof" data-desc="Psychologisches Prinzip, dem Verhalten anderer zu folgen – z.B. durch Likes. Social Proof erklärt, warum virale Inhalte immer viraler werden. Plattformen nutzen diesen Mechanismus durch öffentliche Metriken und Popularitätsanzeigen.">Social Proof</button>
      <button class="glossar-term" data-category="psychologie" data-id="soziabilitaet" data-desc="Grundlegendes Bedürfnis nach sozialer Interaktion und Zugehörigkeit. Social Media adressiert dieses Bedürfnis, kann es aber nur teilweise erfüllen. Die Qualität digitaler sozialer Verbindungen unterscheidet sich von persönlichen Begegnungen.">Soziabilität</button>
      <button class="glossar-term" data-id="sozialemedien" data-desc="Digitale Plattformen, die Nutzer:innen ermöglichen, Inhalte zu erstellen und zu teilen. Soziale Medien haben Kommunikation, Politik und Wirtschaft fundamental verändert. Sie sind heute zentrale Infrastrukturen öffentlicher Kommunikation.">Soziale Medien</button>
      <button class="glossar-term" data-category="psychologie" data-id="sozialervergleich" data-desc="Bewertung der eigenen Person im Vergleich zu anderen – online oft verzerrt. Social Media intensiviert soziale Vergleiche durch kuratierte Darstellungen und ständige Verfügbarkeit. Aufwärtsvergleiche können Selbstwert und Lebenszufriedenheit mindern.">Sozialer Vergleich</button>
      <button class="glossar-term" data-id="story" data-desc="Temporärer Inhalt, der nach 24 Stunden verschwindet – eingeführt von Snapchat. Stories reduzieren den Druck zur Perfektion und fördern authentischere Inhalte. Das Format wurde von fast allen Plattformen übernommen.">Story</button>
      <button class="glossar-term" data-category="slang" data-id="streak" data-desc="Aufeinanderfolgende Tage der Interaktion auf Snapchat – erzeugt sozialen Druck. Streaks nutzen Gamification, um tägliche Nutzung zu erzwingen. Der Verlust eines Streaks kann besonders für Jugendliche emotional belastend sein.">Streak</button>
      <button class="glossar-term" data-category="psychologie" data-id="stressbewaeltigung" data-desc="Strategien zur Reduzierung von Stress – Social Media oft kontraproduktiv. Obwohl Social Media oft zur Entspannung genutzt wird, zeigen Studien meist negative Auswirkungen auf Stresslevel. Effektive Stressbewältigung erfordert meist offline-Aktivitäten.">Stressbewältigung</button>
      <button class="glossar-term" data-id="targeting" data-desc="Gezielte Ausspielung von Werbung an bestimmte Nutzergruppen. Targeting basiert auf umfangreichen Nutzerprofilen und ermöglicht präzise Ansprache. Es ist das Kerngeschäft der meisten Social-Media-Plattformen und ethisch umstritten.">Targeting</button>
      <button class="glossar-term" data-category="psychologie" data-id="technoference" data-desc="Störung zwischenmenschlicher Interaktionen durch Technologienutzung. Technoference betrifft Eltern-Kind-Beziehungen, Partnerschaften und Freundschaften. Selbst kurze Unterbrechungen durch Smartphones können Beziehungsqualität mindern.">Technoference</button>
      <button class="glossar-term" data-id="telegram" data-desc="2013 gegründeter Messenger, bekannt für Verschlüsselung und große Gruppen. Telegram ist bei datenschutzbewussten Nutzer:innen beliebt, aber auch bei extremistischen Gruppen. Die lockere Moderation macht die Plattform kontrovers.">Telegram</button>
      <button class="glossar-term" data-category="slang" data-id="telephobia" data-desc="Angst vor Telefonaten – besonders bei jüngeren Generationen verbreitet. Telephobia hat mit der Dominanz asynchroner Textkommunikation zugenommen. Telefonate erfordern Echtzeit-Reaktion und werden als invasiver empfunden.">Telephobia</button>
      <button class="glossar-term" data-id="ueberwachungskapitalismus" data-desc="Wirtschaftsmodell, das auf der Sammlung und Monetarisierung von Nutzerdaten basiert. Der Begriff wurde von Shoshana Zuboff geprägt und beschreibt die Kernlogik der Plattformökonomie. Überwachungskapitalismus transformiert menschliches Verhalten in handelbare Vorhersageprodukte.">Überwachungskapitalismus</button>
      <button class="glossar-term" data-id="user" data-desc="Nutzer:in einer digitalen Plattform oder Anwendung. Der Begriff „User“ impliziert eine Abhängigkeitsbeziehung ähnlich wie bei Substanzkonsum. Kritiker:innen bevorzugen „Nutzer:in“ oder „Person“, um agency zu betonen.">User</button>
      <button class="glossar-term" data-category="psychologie" data-id="wiederholungszwang" data-desc="Unbewusster Drang, bestimmte Verhaltensweisen zu wiederholen – z.B. App-Öffnen. Der Wiederholungszwang wird durch variable Belohnungen verstärkt. Er kann zu automatischem Checking führen, das der bewussten Kontrolle entgleitet.">Wiederholungszwang</button>
      <button class="glossar-term" data-id="wikipedia" data-desc="2001 gegründete freie Online-Enzyklopädie, kollaborativ erstellt. Wikipedia ist eines der erfolgreichsten Beispiele nicht-kommerzieller Internet-Projekte. Die Plattform demonstriert das Potenzial kollektiver Wissensproduktion.">Wikipedia</button>
      <button class="glossar-term" data-category="slang" data-id="wokeness" data-desc="Bewusstsein für soziale Ungerechtigkeiten – in sozialen Medien oft diskutiert. Der Begriff wird sowohl affirmativ als auch pejorativ verwendet. Wokeness-Debatten zeigen die Politisierung sozialer Medien und kulturelle Konflikte.">Wokeness</button>
      <button class="glossar-term" data-id="worldwideweb" data-desc="1989 von Tim Berners-Lee erfundenes System zur Verknüpfung von Dokumenten im Internet. Das WWW demokratisierte Informationszugang und legte den Grundstein für soziale Medien. Berners-Lee kritisiert heute die Zentralisierung durch Plattformen.">World Wide Web</button>
      <button class="glossar-term" data-category="psychologie" data-id="zeitwahrnehmung" data-desc="Subjektives Erleben von Zeit – in sozialen Medien oft verzerrt. Time Blindness ist ein häufiges Phänomen bei Social-Media-Nutzung. Stunden können wie Minuten vergehen, was Produktivität und Schlaf beeinträchtigt.">Zeitwahrnehmung</button>
      <button class="glossar-term" data-id="zivilisationskrankheit" data-desc="Erkrankung, die durch modernen Lebensstil begünstigt wird – zunehmend auch durch Digitalkonsum. Zu den digitalen Zivilisationskrankheiten zählen Haltungsschäden, Schlafstörungen und psychische Belastungen. Die Langzeitfolgen intensiver Social-Media-Nutzung werden noch erforscht.">Zivilisationskrankheit</button>
    </div>
  </div>

  <!-- Filter-Buttons -->
  <div class="glossar-filter">
    <button class="filter-btn" data-filter="psychologie">Medienpsychologie</button>
    <button class="filter-btn" data-filter="slang">Slang</button>
  </div>

  <script>
    const glossarItems = document.getElementById('glossar-items');
    const glossarTerms = document.querySelectorAll('.glossar-term');
    const filterBtns = document.querySelectorAll('.filter-btn');
    let activeDescEl = null;
    let activeFilter = null;

    // Filter-Logik
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const filter = btn.getAttribute('data-filter');
        
        // Toggle: wenn gleicher Filter nochmal geklickt, deaktivieren
        if (activeFilter === filter) {
          activeFilter = null;
          btn.classList.remove('active');
          // Alle Begriffe wieder normal anzeigen
          glossarTerms.forEach(term => term.classList.remove('faded'));
        } else {
          // Anderen Filter aktivieren
          activeFilter = filter;
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          // Begriffe filtern
          glossarTerms.forEach(term => {
            const category = term.getAttribute('data-category');
            if (category === filter) {
              term.classList.remove('faded');
            } else {
              term.classList.add('faded');
            }
          });
        }
      });
    });

    // Klick-Logik für einzelne Begriffe
    glossarTerms.forEach(term => {
      term.addEventListener('click', () => {
        const wasActive = term.classList.contains('active');
        
        // Entferne aktive Klasse von allen Begriffen
        glossarTerms.forEach(t => t.classList.remove('active'));
        
        // Entferne vorhandene Beschreibung
        if (activeDescEl) {
          activeDescEl.remove();
          activeDescEl = null;
        }
        
        // Wenn nicht bereits aktiv, zeige Beschreibung
        if (!wasActive) {
          term.classList.add('active');
          
          const desc = term.getAttribute('data-desc');
          if (desc) {
            // Erstelle Beschreibungs-Element
            activeDescEl = document.createElement('div');
            activeDescEl.className = 'glossar-description-inline';
            activeDescEl.innerHTML = '<p>' + desc + '</p>';
            
            // Fuege nach dem Begriff ein
            term.insertAdjacentElement('afterend', activeDescEl);
            
            // Warte kurz bis Layout aktualisiert ist, dann scrolle wenn nötig
            requestAnimationFrame(() => {
              const rect = activeDescEl.getBoundingClientRect();
              const screenMid = window.innerHeight / 2;
              
              if (rect.top > screenMid) {
                // Scrolle so, dass die Beschreibung vertikal zentriert ist
                activeDescEl.scrollIntoView({
                  behavior: 'smooth',
                  block: 'center'
                });
              }
            });
          }
        }
      });
    });

    // Theme aus localStorage wiederherstellen
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
